[package]
name = "imprenta-app"
version = "1.1.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "imprenta_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
bcrypt = "0.15"
# keyring no trae ningún backend de SO por default (a propósito, para no
# forzar una elección de crypto backend en Linux que este proyecto no
# necesita — Clio solo corre en Windows y macOS, ver CLAUDE.md). Sin
# "apple-native"/"windows-native" acá, Entry::new() compilaría pero
# fallaría en runtime por no tener ningún almacén de credenciales
# registrado. Ambas features conviven sin problema en el mismo Cargo.toml:
# cada build (GitHub Actions matrix macos-latest/windows-latest) solo
# activa el backend real de su propio target OS.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

